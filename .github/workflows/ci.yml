name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
